name: DMG

# Manual only. Builds an unsigned, un-notarized drag-to-Applications image
# from the current branch and uploads it as a workflow artifact. Nothing here
# touches the maintainer's Developer ID or the Sparkle appcast.
on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make test-ci
      - name: Build Release (ad-hoc signed)
        run: |
          xcodegen generate
          xcodebuild -project Codenotch.xcodeproj -scheme Codenotch -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO build | tail -20
      # Sparkle ships signed with its own Developer ID. Library validation
      # under the hardened runtime refuses a framework whose Team ID differs
      # from the app's, and an ad-hoc signature has no Team ID at all — so on
      # a real Mac the app died at launch with "different Team IDs", even after
      # Sparkle itself was re-signed ad-hoc. The hardened runtime is therefore
      # off for this unsigned build (it is what turns library validation on),
      # and every nested piece is re-signed ad-hoc, innermost first, so the
      # bundle verifies as one unit.
      - name: Re-sign nested code ad-hoc
        run: |
          APP=build/dd/Build/Products/Release/Codenotch.app
          SP=$APP/Contents/Frameworks/Sparkle.framework/Versions/B
          for f in "$SP/XPCServices/Downloader.xpc" "$SP/XPCServices/Installer.xpc" \
                   "$SP/Updater.app" "$SP/Autoupdate" "$APP/Contents/Frameworks/Sparkle.framework"; do
            codesign --force --sign - "$f"
          done
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package
        run: |
          mkdir -p build/stage
          cp -R build/dd/Build/Products/Release/Codenotch.app build/stage/
          ln -s /Applications build/stage/Applications
          hdiutil create -volname Codenotch -srcfolder build/stage -ov -format UDZO build/Codenotch-unsigned.dmg
          shasum -a 256 build/Codenotch-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Codenotch-unsigned-dmg
          path: build/Codenotch-unsigned.dmg

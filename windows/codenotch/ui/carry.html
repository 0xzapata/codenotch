<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* The notch in the hand, drawn over the whole work area while it is carried round the border
     (carry.rs). Click-through and never focused: Rust sets both on the window. The notch's own page
     is empty meanwhile, so what is drawn here has to be that notch to the pixel: the palette and the
     cells below are notch.html's, and test-light-surface.cjs holds the two to each other. */
  :root{
    --pill:#000; --edge:#2e2e2e; --track:#303030; --hole:#2a2a2a;
    --ample:#00FF88; --watch:#F2FF00; --crit:#FF3F00;
    --ink:#ffffff; --ink-2:#e8e8ea; --ink-dim:#808080;
  }
  :root[data-theme="light"]{
    --pill:#f5f5f7; --edge:#d2d2d7; --track:rgba(0,0,0,.16); --hole:#ffffff;
    --ample:#00A356; --watch:#B08800; --crit:#FF3F00;
    --ink:#1d1d1f; --ink-2:#1d1d1f; --ink-dim:#6b6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;cursor:default}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  svg#body{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
  /* The edge line inside the shape, as notch.html's border is: twice as wide, clipped to the shape */
  #notch{fill:var(--pill);stroke:var(--edge);stroke-width:2}
  .slot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

  /* notch.html's cells */
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  :root{--ring:44px;--k:calc(44 / 56)}
  .ringwrap{position:relative;width:var(--ring);height:var(--ring)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible}
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(20px * var(--k));font-weight:700;color:var(--ink-2);letter-spacing:-.5px;
  }
  .glyph.small{font-size:calc(15px * var(--k))}
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:calc(26px * var(--k));height:calc(26px * var(--k));color:var(--ink-2)}
  .glyph .mark svg{width:calc(26px * var(--k));height:calc(26px * var(--k));fill:currentColor}
  .glyph img.png{width:calc(26px * var(--k));height:calc(26px * var(--k));object-fit:contain}
  .glyph img.appicon{width:calc(30px * var(--k));height:calc(30px * var(--k));border-radius:calc(8px * var(--k));object-fit:cover}
  .pct{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}}
</style>
</head>
<body>
<svg id="body">
  <defs><clipPath id="clip"><path id="clipShape"/></clipPath></defs>
  <path id="notch" clip-path="url(#clip)"/>
</svg>
<div id="cells"></div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* ---- the border as one line (carry.rs's BorderTrack) ---------------------------------------- */
let st = null;
const perimeter = () => 2 * (st.w + st.h);
const wrap = p => { const P = perimeter(); return ((p % P) + P) % P; };
const signed = d => { const P = perimeter(); d = wrap(d); return d > P / 2 ? d - P : d; };
const vertical = edge => edge === 'left' || edge === 'right';
function placeAt(p){
  const { w, h } = st, s = wrap(p);
  if(s < w) return ['top', s];
  if(s < w + h) return ['right', s - w];
  if(s < 2 * w + h) return ['bottom', 2 * w + h - s];
  return ['left', 2 * w + 2 * h - s];
}
function positionOn(edge, along){
  const { w, h } = st, c = (v, max) => Math.min(Math.max(v, 0), max);
  if(edge === 'top') return c(along, w);
  if(edge === 'right') return w + c(along, h);
  if(edge === 'bottom') return 2 * w + h - c(along, w);
  return wrap(2 * w + 2 * h - c(along, h));
}
/* ---- the spring (NotchWindowController.spring) ----------------------------------------------
   Following the hand it is brisk and all but dead; coming to rest on its own it is gentler, with a
   little give past where it stops and back. Two half steps keep a stiff spring steady at a slow frame. */
const FOLLOW = { response: .2, damping: .84 }, SETTLE = { response: .3, damping: .74 };
function spring(gap, velocity, elapsed, { response, damping }){
  const omega = 2 * Math.PI / response;
  let moved = 0;
  for(let i = 0; i < 2; i++){
    const dt = elapsed / 2;
    velocity += (omega * omega * (gap - moved) - 2 * damping * omega * velocity) * dt;
    moved += velocity * dt;
  }
  return { moved, velocity };
}

/* ---- drawing -------------------------------------------------------------------------------- */
/* A point `u` along an edge and `v` in from it, on the screen; and whether that turns the drawing
   over, which reverses an arc's sweep. */
function toScreen(edge, u, v){
  if(edge === 'right') return [st.w - v, u];
  if(edge === 'left') return [v, u];
  if(edge === 'bottom') return [u, st.h - v];
  return [u, v];
}
const mirrored = edge => edge === 'left' || edge === 'bottom';
const OFF = 40; // how far the body runs on past the screen's edge, out of sight

/* The notch on `edge` from `a` to `b` along it: notch.html's pill — `depth` deep, its free corners
   rounded by `r`, and a flare of radius `f` either end curving into the screen's edge. */
function notchPath(edge, a, b, depth, r, f){
  const flip = mirrored(edge);
  const pt = (u, v) => toScreen(edge, u, v).map(n => n.toFixed(2)).join(' ');
  const arc = (rad, sweep, u, v) => `A${rad.toFixed(2)} ${rad.toFixed(2)} 0 0 ${flip ? 1 - sweep : sweep} ${pt(u, v)}`;
  return `M${pt(a - f, -OFF)} L${pt(a - f, 0)} ${arc(f, 1, a, f)} L${pt(a, depth - r)} ${arc(r, 0, a + r, depth)}`
    + ` L${pt(b - r, depth)} ${arc(r, 0, b, depth - r)} L${pt(b, f)} ${arc(f, 1, b + f, 0)} L${pt(b + f, -OFF)} Z`;
}

function dims(edge){
  const k = st.size, o = vertical(edge) ? st.shape.upright : st.shape.flat;
  return { depth: o.depth * k, length: o.length * k, pitch: o.pitch * k, inset: o.inset * k };
}

const body = document.getElementById('notch'), clipShape = document.getElementById('clipShape');
const cellBox = document.getElementById('cells');
let slots = [];
function buildCells(){
  cellBox.innerHTML = (st.shape.cells || []).map(html => `<div class="slot">${html}</div>`).join('');
  slots = [...cellBox.children].map(el => ({ el, w: el.offsetWidth, h: el.offsetHeight }));
}

function draw(p){
  const [edge, along] = placeAt(p), d = dims(edge), k = st.size;
  const shape = notchPath(edge, along - d.length / 2, along + d.length / 2, d.depth, st.shape.radius * k, st.shape.fillet * k);
  body.setAttribute('d', shape); clipShape.setAttribute('d', shape);
  const n = slots.length;
  slots.forEach((s, i) => {
    const [x, y] = toScreen(edge, along + (i - (n - 1) / 2) * d.pitch, d.inset);
    s.el.style.transform = `translate(${(x - s.w * k / 2).toFixed(2)}px,${(y - s.h * k / 2).toFixed(2)}px) scale(${k})`;
  });
}

/* ---- following the hand --------------------------------------------------------------------- */
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let shown = 0, target = 0, velocity = 0, lastTick = null, settling = false, ticking = false;

/* Where it comes to rest for a middle at `p`: on its edge, no nearer an end than its window can be
   put, since the window is kept wholly in the work area and is longer than the notch. */
function resting(p){
  const [edge, along] = placeAt(p), span = vertical(edge) ? st.h : st.w;
  const low = st.reach, high = span - st.reach;
  return positionOn(edge, low <= high ? Math.min(Math.max(along, low), high) : span / 2);
}

function tick(t){
  if(!st){ ticking = false; return; }
  const elapsed = lastTick == null ? 1 / 60 : Math.min(Math.max((t - lastTick) / 1000, 0), 1 / 30);
  lastTick = t;
  const gap = signed(target - shown);
  if(still || (Math.abs(gap) < (settling ? .3 : .05) && Math.abs(velocity) < (settling ? 6 : 1))){
    velocity = 0;
    if(shown !== target){ shown = target; draw(shown); }
    if(settling){ settling = false; invoke('carry_landed', { seq: st.seq, place: shown }).catch(() => {}); }
  } else {
    const step = spring(gap, velocity, elapsed, settling ? SETTLE : FOLLOW);
    velocity = step.velocity;
    shown = wrap(shown + step.moved);
    draw(shown);
  }
  requestAnimationFrame(tick);
}

function start(init){
  if(!init) return;
  st = init;
  shown = target = init.place;
  velocity = 0; lastTick = null; settling = false;
  buildCells();
  draw(shown);
  if(!ticking){ ticking = true; requestAnimationFrame(tick); }
  // Said once it is on the screen, not when it is asked for: the notch empties itself on this
  requestAnimationFrame(() => requestAnimationFrame(() => invoke('carry_shown', { seq: init.seq }).catch(() => {})));
}

listen('carry_init', e => start(e.payload)).catch(() => {});
listen('carry_target', e => { if(st && !settling) target = e.payload; }).catch(() => {});
listen('carry_release', () => { if(st){ target = resting(target); settling = true; } }).catch(() => {});
invoke('get_carry').then(v => { if(v && (!st || st.seq !== v.seq)) start(v); }).catch(() => {});
</script>
</body>
</html>
